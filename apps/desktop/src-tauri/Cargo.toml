[package]
name = "bit-desktop"
version = "0.0.0"
description = "Bit desktop shell"
license = "MIT"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "bit_desktop"
path = "src/lib.rs"

[[bin]]
name = "bit"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2.7.2"

[dependencies]
serde_json = "1"
tauri = "2.12.2"
tauri-plugin-shell = "2.5.0"
